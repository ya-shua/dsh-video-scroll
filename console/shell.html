  html, body { margin: 0; background: #0f1420; color: #dbe4f5; font: 14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; min-height: 100%; }

    --dsw-alias-bg-layer-3: rgba(160,175,210,.16);

    --dsw-alias-border-l2: rgba(160,175,210,.22);
    --dsw-alias-brand-primary: #4f7cff;
    --dsw-alias-interactive-bg-hover: rgba(127,140,175,.18);
    --dsw-alias-label-primary: #dbe4f5;
    --dsw-alias-label-secondary: #aeb9d6;
    --dsw-alias-label-tertiary: #8494b3;
    color-scheme: dark;
  }
</style>
</head>
